version: '3'

services:
  user_service:
   
    depends_on:
      - db
    restart: unless-stopped

  plant_service:
   
    depends_on:
      - db
    restart: unless-stopped

  simulation_service:
   
    depends_on:
      - db
      - plant_service
    restart: unless-stopped

  websocket_service:
    
    restart: unless-stopped
  
  bug_service:
   
    depends_on:
      - db
    restart: unless-stopped

  main_app:
     
    depends_on:
      - user_service
      - plant_service
      - simulation_service
      - websocket_service
    restart: unless-stopped

  db:
    image: postgres:12
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
